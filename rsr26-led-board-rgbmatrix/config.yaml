app:
  hashtag: "#RSR26"

collector:
  type: "twscrape"          # "mock" or "twscrape"
  poll_interval_seconds: 30
  max_buffer: 15
  max_results: 15
  exclude_retweets: true
  db_path: "accounts.db"  # twscrape accounts DB, see README for setup
  state_path: "twscrape_state.json"  # 新規追加
matrix:
  width: 128
  height: 64
  output: "rgb_matrix"
  brightness: 60
  brightness_day: 60
  brightness_night: 40
  night_start: "18:00"
  night_end: "05:00"

rgb_matrix:
  rows: 64
  cols: 128
  chain_length: 1
  parallel: 1
  hardware_mapping: "regular"
  gpio_slowdown: 3
  brightness: 60
  disable_hardware_pulsing: true
  multiplexing: 0
  pwm_bits: 8
  led_rgb_sequence: "RGB"
  show_refresh_rate: false
  font_candidates:
    - "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
    - "/usr/share/fonts/truetype/noto/NotoColorEmoji.ttf"
    - "/usr/share/fonts/truetype/ancient-scripts/Symbola_hint.ttf"

preview:
  scale: 6

console:
  frame_width_chars: 32

layout:
  title_font_size: 12
  body_font_size: 17
  title_y: 2
  separator_y: 20
  body_y: 24
  bold_px: 1

scroll:
  step_pixels: 2
  end_hold_frames: 5
  short_message_frames: 60

message_builder:
  filters:
    remove_urls: true
  title_text: "#RSR26 LIVE"
  latest_post_prefix: ">"

scheduler:
  timetable_path: "timetable.yaml"
  advance_minutes: 10
  countdown_enabled: true
  countdown_refresh_seconds: 1.0

display:
  emoji_demojize: true
  emoji_demojize_mode: "missing_only"  # "missing_only" or "all"

idle_media:
  enabled: true
  folder: "idle_media"
  image_seconds: 5
  video_fps_cap: 12
  random: false
  scan_interval_seconds: 5
  clock_overlay_enabled: true
  clock_format: "%H:%M:%S"
  clock_position: "bottom_right"  # top_left / top_right / bottom_left / bottom_right
  clock_margin_x: 2
  clock_margin_y: 2
  clock_font_size: 8
  clock_color: [220, 220, 220]
  clock_shadow: true

remote_control:
  enabled: true
  host: "0.0.0.0"
  port: 5000
  token: "change-me"
