app:
  hashtag: "#RSR26"

collector:
  type: "twscrape"          # "mock" or "twscrape"
  poll_interval_seconds: 30
  max_buffer: 20
  max_results: 20
  exclude_retweets: true
  db_path: "accounts.db"  # twscrape accounts DB, see README for setup

matrix:
  width: 128
  height: 64
  output: "rgb_matrix"
  brightness: 60
  brightness_day: 60
  brightness_night: 40
  night_start: "18:00"
  night_end: "05:00"

rgb_matrix:
  rows: 64
  cols: 128
  chain_length: 1
  parallel: 1
  hardware_mapping: "regular"
  gpio_slowdown: 3
  brightness: 60
  disable_hardware_pulsing: true
  multiplexing: 0
  pwm_bits: 8
  led_rgb_sequence: "RGB"
  show_refresh_rate: false
  font_candidates:
    - "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"

preview:
  scale: 6

console:
  frame_width_chars: 32

layout:
  title_font_size: 12
  body_font_size: 16
  title_y: 4
  separator_y: 20
  body_y: 26
  bold_px: 1

scroll:
  step_pixels: 2
  end_hold_frames: 5
  short_message_frames: 60

message_builder:
  title_text: "#RSR26 LIVE"
  latest_post_prefix: ">"
